<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7">
<title>출퇴근 기록</title>
<meta name="description" content="출근·퇴근 아이콘을 누르면 구글 시트에 기록돼요. 사람마다 따로 설정할 수 있어요.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출퇴근">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root {
  --bg: #F4F5F7; --card: #FFFFFF; --text: #191F28; --sub: #6B7684; --line: #E5E8EB;
  --in: #FF8A3D; --in-soft: #FFF1E6; --out: #5B5FEF; --out-soft: #ECEDFE;
  --ok: #1DB46A; --warn: #E5484D; --shadow: 0 8px 24px rgba(25,31,40,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101216; --card: #1B1E24; --text: #F2F4F6; --sub: #9AA4B0; --line: #2B3038;
    --in-soft: #3A2616; --out-soft: #23244A; --shadow: 0 8px 24px rgba(0,0,0,.35);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif; }
body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); }
.wrap { max-width: 520px; margin: 0 auto; }
button { font: inherit; color: inherit; cursor: pointer; }
header { display: flex; align-items: center; gap: 8px; padding: 18px 0 8px; }
.who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; text-align: left; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--out-soft); color: var(--out);
  display: grid; place-items: center; font-weight: 700; flex: none; }
.who b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--sub); font-size: 12px; }
.who .chev { margin-left: auto; color: var(--sub); }
.icon-btn { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
  display: grid; place-items: center; flex: none; }
.clock { text-align: center; padding: 22px 0 6px; }
.clock .date { color: var(--sub); font-size: 15px; }
.clock .time { font-size: 52px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.punch { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0; }
.punch button { border: 0; border-radius: 28px; padding: 22px 8px 18px; background: var(--card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 10px; transition: transform .12s; position: relative; }
.punch button:active { transform: scale(.96); }
.punch button:disabled { opacity: .55; }
.punch .ico { width: 104px; height: 104px; border-radius: 32px; display: grid; place-items: center; }
.punch .in .ico { background: var(--in-soft); color: var(--in); }
.punch .out .ico { background: var(--out-soft); color: var(--out); }
.punch .label { font-size: 22px; font-weight: 800; }
.punch .stamp { font-size: 13px; color: var(--sub); min-height: 18px; font-variant-numeric: tabular-nums; }
.punch .done { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--ok); color: #fff; display: none; place-items: center; }
.punch .is-done .done { display: grid; }
.card { background: var(--card); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
.card h2 { font-size: 15px; margin: 0 0 10px; color: var(--sub); font-weight: 600; display: flex; justify-content: space-between; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
.summary div + div { border-left: 1px solid var(--line); }
.summary small { display: block; color: var(--sub); font-size: 12px; margin-bottom: 4px; }
.summary b { font-size: 17px; font-variant-numeric: tabular-nums; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.hist li:first-child { border-top: 0; }
.tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 8px; flex: none; }
.tag.in { background: var(--in-soft); color: var(--in); }
.tag.out { background: var(--out-soft); color: var(--out); }
.hist .t { font-variant-numeric: tabular-nums; flex: 1; }
.st { font-size: 12px; color: var(--sub); }
.st.ok { color: var(--ok); } .st.wait { color: var(--in); } .st.err { color: var(--warn); }
.empty { color: var(--sub); font-size: 14px; text-align: center; padding: 8px 0; }
.banner { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 14px; font-size: 14px;
  background: var(--in-soft); color: var(--text); align-items: center; gap: 10px; }
.banner.show { display: flex; }
.banner span { flex: 1; }
.banner button { border: 0; background: var(--card); border-radius: 10px; padding: 7px 10px; font-weight: 600; }
.link-btn { border: 0; background: none; color: var(--out); font-size: 13px; font-weight: 600; padding: 0; }

/* 시트(모달) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 20; }
.sheet-bg.show { display: block; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 24px 24px 0 0;
  max-height: 92dvh; overflow-y: auto; padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .22s ease; max-width: 560px; margin: 0 auto; }
.sheet.show { transform: none; }
.sheet h3 { margin: 0 0 4px; font-size: 20px; }
.sheet p.desc { margin: 0 0 16px; color: var(--sub); font-size: 14px; line-height: 1.5; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.field label em { font-style: normal; color: var(--sub); font-weight: 400; }
.field input, .field textarea { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; font-size: 16px; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--out); border-color: transparent; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 14px; }
.check input { width: 20px; height: 20px; }
.row { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font-weight: 700; font-size: 16px; background: var(--bg); }
.btn.primary { background: var(--out); color: #fff; }
.btn.in { background: var(--in); color: #fff; }
.btn.danger { color: var(--warn); }
.btn.small { flex: none; padding: 10px 12px; font-size: 14px; }
.people { list-style: none; margin: 0 0 14px; padding: 0; }
.people li { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 1px solid var(--line); margin-bottom: 8px; }
.people li.active { border-color: var(--out); background: var(--out-soft); }
.people .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 0; }
.people .pick b { display: block; }
.people .pick small { color: var(--sub); font-size: 12px; }
.confirm-ico { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; margin: 4px auto 12px; }
.toast { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -20px); word-break: keep-all; border: 1px solid rgba(255,255,255,.12);
  background: #191F28; color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 15px; opacity: 0;
  transition: .2s; z-index: 40; max-width: calc(100% - 32px); pointer-events: none; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.hint { font-size: 13px; color: var(--sub); line-height: 1.5; margin: 0 0 14px; }
.test-result { font-size: 13px; margin: -6px 0 14px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="who" id="whoBtn" aria-label="사람 선택">
      <span class="avatar" id="avatar">?</span>
      <span style="min-width:0">
        <b id="whoName">사람을 등록해 주세요</b>
        <small id="whoSub">탭해서 이름·시트 설정</small>
      </span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="내 설정">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="clock" aria-live="off">
    <div class="date" id="today"></div>
    <div class="time" id="now">--:--:--</div>
  </section>

  <section class="punch">
    <button class="in" id="inBtn" aria-label="출근 기록">
      <span class="done" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="ico">
        <!-- 출근: 떠오르는 해 + 들어가는 화살표 -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 44a18 18 0 0 1 36 0" fill="currentColor" fill-opacity=".18"/>
          <path d="M8 44h48"/>
          <path d="M32 10v7M14.6 19.6l4.9 4.9M49.4 19.6l-4.9 4.9M6 32h5M53 32h5"/>
          <path d="M32 54V34M24 41l8-8 8 8" />
        </svg>
      </span>
      <span class="label">출근</span>
      <span class="stamp" id="inStamp">&nbsp;</span>
    </button>
    <button class="out" id="outBtn" aria-label="퇴근 기록">
      <span class="done" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <span class="ico">
        <!-- 퇴근: 달 + 별 + 집 -->
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M40 8a16 16 0 1 0 16 22A13 13 0 0 1 40 8z" fill="currentColor" fill-opacity=".18"/>
          <path d="M14 10v6M11 13h6"/>
          <path d="M10 56V42l13-10 13 10v14z" fill="currentColor" fill-opacity=".18"/>
          <path d="M19 56v-8h8v8"/>
        </svg>
      </span>
      <span class="label">퇴근</span>
      <span class="stamp" id="outStamp">&nbsp;</span>
    </button>
  </section>

  <div class="banner" id="setupBanner">
    <span>먼저 이름과 구글 시트 주소를 설정해 주세요.</span>
    <button id="setupGo">설정하기</button>
  </div>
  <div class="banner" id="queueBanner">
    <span id="queueText"></span>
    <button id="queueRetry">다시 보내기</button>
  </div>

  <section class="card">
    <h2>오늘</h2>
    <div class="summary">
      <div><small>출근</small><b id="sumIn">-</b></div>
      <div><small>퇴근</small><b id="sumOut">-</b></div>
      <div><small>근무</small><b id="sumWork">-</b></div>
    </div>
  </section>

  <section class="card">
    <h2>최근 기록 <button class="link-btn" id="openSheet" hidden>시트 열기</button></h2>
    <ul class="hist" id="hist"></ul>
  </section>
</div>

<!-- 사람 선택 -->
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="peopleSheet" role="dialog" aria-modal="true" aria-labelledby="peopleTitle">
  <h3 id="peopleTitle">누가 기록하나요?</h3>
  <p class="desc">이 기기에서 여러 사람이 쓸 수 있어요. 사람마다 이름, 시트 탭, 구글 시트 주소를 따로 정할 수 있어요.</p>
  <ul class="people" id="peopleList"></ul>
  <div class="row">
    <button class="btn" id="peopleClose">닫기</button>
    <button class="btn primary" id="addPerson">+ 사람 추가</button>
  </div>
</div>

<!-- 사람별 설정 -->
<div class="sheet" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editTitle">
  <h3 id="editTitle">내 설정</h3>
  <p class="desc">버튼을 누르면 아래 구글 시트에 기록돼요. 시트 쪽 준비 방법은 <a href="README.md" target="_blank" rel="noopener">설치 안내</a>를 보세요.</p>
  <form id="editForm" autocomplete="off">
    <div class="field">
      <label for="fName">이름</label>
      <input id="fName" required maxlength="40" placeholder="홍길동">
    </div>
    <div class="field">
      <label for="fEmp">사번 / 소속 <em>(선택)</em></label>
      <input id="fEmp" maxlength="60" placeholder="예: 2024001 · 행정팀">
    </div>
    <div class="field">
      <label for="fTab">시트 탭 이름 <em>(비우면 이름으로 만들어져요)</em></label>
      <input id="fTab" maxlength="60" placeholder="예: 홍길동">
    </div>
    <div class="field">
      <label for="fUrl">구글 시트 웹 앱 주소 (Apps Script URL)</label>
      <input id="fUrl" type="url" inputmode="url" required placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="field">
      <label for="fSecret">비밀키 <em>(Apps Script의 SECRET과 같게, 없으면 비움)</em></label>
      <input id="fSecret" type="password" maxlength="100">
    </div>
    <div class="field">
      <label for="fSheetLink">구글 시트 링크 <em>(선택 · "시트 열기" 버튼용)</em></label>
      <input id="fSheetLink" type="url" inputmode="url" placeholder="https://docs.google.com/spreadsheets/d/…">
    </div>
    <label class="check"><input type="checkbox" id="fConfirm" checked> 누를 때 한 번 더 확인하기</label>
    <label class="check"><input type="checkbox" id="fMemo"> 기록할 때 메모 입력받기 (외근·재택 등)</label>
    <div class="row" style="margin-bottom:8px">
      <button type="button" class="btn small" id="testBtn">연결 테스트</button>
    </div>
    <div class="test-result" id="testResult"></div>
    <div class="row">
      <button type="button" class="btn danger" id="delPerson">삭제</button>
      <button type="button" class="btn" id="editCancel">취소</button>
      <button type="submit" class="btn primary">저장</button>
    </div>
  </form>
</div>

<!-- 기록 확인 -->
<div class="sheet" id="confirmSheet" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-ico" id="confirmIco"></div>
  <h3 id="confirmTitle" style="text-align:center"></h3>
  <p class="desc" id="confirmDesc" style="text-align:center"></p>
  <div class="field" id="memoField" hidden>
    <label for="fMemoText">메모 <em>(선택)</em></label>
    <input id="fMemoText" maxlength="100" placeholder="예: 외근, 재택, 지각 사유">
  </div>
  <div class="row">
    <button class="btn" id="confirmNo">취소</button>
    <button class="btn primary" id="confirmYes">기록하기</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js?v=1"></script>
</body>
</html>
