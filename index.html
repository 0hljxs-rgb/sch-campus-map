<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F2F3EF">
<meta name="format-detection" content="telephone=no">
<title>순천향대 캠퍼스맵</title>
<meta name="description" content="순천향대 아산캠퍼스 3D 지도 · 건물 층수 · 편의점·카페·AED (비공식)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="캠퍼스맵">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <div id="map" aria-label="캠퍼스 3D 지도">
    <div id="stage">
      <div id="plane">
        <img id="ground" src="assets/ground.svg" alt="" draggable="false">
        <div id="layer-trees"></div>
        <div id="layer-buildings"></div>
        <div id="layer-markers"></div>
      </div>
    </div>
  </div>

  <header id="topbar">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <input id="search" type="search" placeholder="건물 이름이나 강의실 코드 검색" autocomplete="off" enterkeyhint="search" aria-label="건물 검색">
      <button id="search-clear" type="button" aria-label="검색어 지우기" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <ul id="results" role="listbox" hidden></ul>
  </header>

  <nav id="controls" aria-label="지도 조작">
    <button type="button" id="btn-reset" class="ctl" aria-label="처음 시점으로">
      <svg viewBox="0 0 24 24" aria-hidden="true" id="compass"><path d="M12 3l3.5 9H8.5z" class="n"></path><path d="M12 21l-3.5-9h7z" class="s"></path></svg>
    </button>
    <button type="button" id="btn-tilt" class="ctl mono" aria-label="2D·3D 전환">2D</button>
    <button type="button" id="btn-names" class="ctl" aria-label="건물 이름 표시" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V4h16v3"></path><path d="M9 20h6"></path><path d="M12 4v16"></path></svg>
    </button>
    <button type="button" id="btn-amen" class="ctl on" aria-label="편의점·카페 표시" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5V9z"></path><path d="M16 11h1.5a2 2 0 0 1 0 4H16"></path><path d="M8 3.5v2M11 3.5v2"></path></svg>
    </button>
  </nav>

  <section id="sheet" aria-label="건물 정보">
    <button type="button" id="sheet-handle" aria-label="목록 펼치기"><span></span></button>
    <div id="sheet-body">
      <div id="selected"></div>
      <div id="directory"></div>
      <footer class="fine">
        <p><strong>비공식 앱</strong> · 순천향대학교에서 만든 공식 앱이 아니에요.</p>
        <p>건물 배치: 학교 일러스트 캠퍼스맵 기준 재구성 · 층수·편의시설: 나무위키(2026.09) · AED: 국립중앙의료원 등록 정보</p>
        <p><a href="privacy.html">개인정보처리방침</a></p>
      </footer>
    </div>
  </section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
