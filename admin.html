<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#141B2B">
<title>캠퍼스맵 관리자</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root { --ink: #141B2B; --muted: #5B6676; --faint: #8A93A2; --line: #E3E7ED; --soft: #F4F6F9; --navy: #1B2F5E; --red: #D93A3A; --amber: #E08A1E; --green: #1F8A5B;
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif; color: var(--ink); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F2EFE8; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top) + 14px) 18px 14px; background: var(--ink); color: #fff; }
  header b { font-size: 16px; } header span { font-size: 12.5px; opacity: 0.7; margin-left: auto; }
  header button { border: 0; background: rgba(255,255,255,0.12); color: #fff; border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  main { max-width: 760px; margin: 0 auto; padding: 18px 16px 60px; display: grid; gap: 18px; }
  section { background: #fff; border-radius: 18px; padding: 18px; box-shadow: 0 6px 20px rgba(16,26,48,0.06); }
  h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
  h2 small { font-size: 12.5px; font-weight: 600; color: var(--faint); }
  .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .empty { padding: 18px; border-radius: 12px; background: var(--soft); color: var(--faint); font-size: 13.5px; text-align: center; }
  .item { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
  .item + .item { margin-top: 10px; }
  .item.pending { border-color: var(--amber); box-shadow: inset 4px 0 0 var(--amber); }
  .item.live { border-color: var(--red); box-shadow: inset 4px 0 0 var(--red); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .row b { color: var(--ink); font-size: 15px; }
  .pill { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--muted); }
  .pill.amber { background: rgba(224,138,30,0.14); color: #B86A0C; } .pill.red { background: rgba(217,58,58,0.12); color: var(--red); }
  .notes { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink); line-height: 1.5; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  button.p, button.g, button.d { height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.p { border: 0; background: var(--red); color: #fff; } button.g { border: 1px solid var(--line); background: #fff; color: var(--ink); } button.d { border: 0; background: var(--ink); color: #fff; }
  button:disabled { opacity: 0.5; }
  form { display: grid; gap: 10px; }
  label { display: grid; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); font: inherit; font-size: 15px; color: var(--ink); }
  textarea { min-height: 70px; resize: vertical; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .err { color: var(--red); font-size: 13px; min-height: 1em; margin: 0; }
  .login { max-width: 420px; margin: 40px auto; }
  .compose { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 11px 16px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 600; }
  #toast[hidden] { display: none; }
</style>
</head>
<body>
<header><b>🚨 캠퍼스맵 긴급 공지 관리</b><span id="who"></span><button id="logout" hidden>로그아웃</button></header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<div id="toast" hidden></div>
<script type="module" src="admin.js"></script>
</body>
</html>
